[package]
name = "formula"
version = "0.1.0"
edition = "2024"

[dependencies]
polars = { version = "0.55.2", default-features = false, features = ["lazy", "log", "fmt", "dtype-categorical"] }
winnow = "1.0.4"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "benchmark"
harness = false
