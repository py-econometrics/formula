name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Polars generates large debug artifacts; CI only needs pass/fail results.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check:
    name: Rust and Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust formatting
        run: pixi run --locked cargo fmt --all -- --check
      - name: Ruff
        run: pixi run --locked lint
      - name: Check formatting
        run: pixi run --locked ruff format --check python
      - name: Type checking
        run: pixi run --locked typecheck
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: pixi run --locked cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Compile examples
        run: pixi run --locked cargo check --examples --locked

  test:
    name: Rust and Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run Rust tests
        run: pixi run --locked cargo test --locked
      - name: Run Python tests
        run: pixi run --locked test
